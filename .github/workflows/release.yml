name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore AltKey/AltKey.csproj
          dotnet restore AltKey.Tools/AltKey.Tools.csproj

      - name: Publish portable single-file
        run: >
          dotnet publish AltKey/AltKey.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/publish

      - name: Publish tools app
        run: >
          dotnet publish AltKey.Tools/AltKey.Tools.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/publish/Tools

      - name: Package portable ZIP
        run: >
          powershell -ExecutionPolicy Bypass
          -File scripts/package-portable.ps1
          -Version ${{ github.ref_name }}
          -BuildDir dist/publish

      # T-9.5: Inno Setup 인스톨러 빌드 (태그에서 버전 직접 치환: v0.1.5 -> 0.1.5)
      - name: Build Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + $env:PATH
          $version = "${{ github.ref_name }}".TrimStart('v')
          # .iss 파일의 AppVersion 줄을 태그 버전으로 직접 치환
          (Get-Content installer/AltKey.iss) `
            -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion `"$version`"" |
            Set-Content installer/AltKey.iss
          iscc installer/AltKey.iss
        shell: pwsh

      - name: Extract version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "RELEASE_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AltKey-Portable-*.zip
            dist/AltKey-Setup-*.exe
          body: |
            ## AltKey ${{ github.ref_name }}

            ### 다운로드

            | 패키지 | 설명 |
            |---------|------|
            | **AltKey-Setup-${{ github.ref_name }}.exe** | 설치 프로그램 (권장). 메인 앱과 `AltKey.Tools` 편집 도구를 함께 포함합니다. |
            | **AltKey-Portable-${{ github.ref_name }}.zip** | 포터블 버전. 원하는 위치에 압축 해제 후 `AltKey.exe`를 실행하면 됩니다. |
            | **AltKey-${{ env.RELEASE_VERSION }}.0.msix** | Microsoft Store 제출용 아티팩트 (서명 없음). 일반 PC에서 직접 설치할 수 없으니, 설치 프로그램이나 포터블 버전을 사용하세요. |
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # MSIX(마이크로소프트 스토어) 패키지 — 독립 잡으로 격리해 팩킹 실패가
  # 포터블·인스톨러 릴리스를 깨지 않게 한다. needs: release 로 기존 릴리스가
  # 먼저 생성된 뒤에 같은 릴리스에 .msix만 추가한다(경쟁 조건 없음).
  msix:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore AltKey/AltKey.csproj
          dotnet restore AltKey.Tools/AltKey.Tools.csproj

      # IncludeNativeLibrariesForSelfExtract=true 로 네이티브 DLL을 exe에 번들링해
      # 스테이징에 별도 _cor3.dll 없이 단일 AltKey.exe만 들어가게 한다.
      - name: Publish portable single-file
        run: >
          dotnet publish AltKey/AltKey.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/publish

      - name: Publish tools app
        run: >
          dotnet publish AltKey.Tools/AltKey.Tools.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/publish/Tools

      # 스테이징 조립 + MakeAppx 팩킹. 서명 없이 만든다(스토어 제출용, MS가 재서명).
      - name: Package MSIX
        run: >
          powershell -ExecutionPolicy Bypass
          -File scripts/package-msix.ps1
          -Version ${{ github.ref_name }}
          -BuildDir dist/publish

      - name: Upload MSIX to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AltKey-*.msix
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
